services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml-service:
    build:
      context: ./ml-service
    restart: unless-stopped
    env_file:
      - ./ml-service/.env
    environment:
      PORT: 8000
      FRONTEND_URL: http://localhost:3003
      BACKEND_URL: http://backend:5000
      ENABLE_LLM_SYMPTOM: "false"
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
      - ml-service
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/healthbridge
      JWT_SECRET: change-this-local-secret
      FRONTEND_URL: http://localhost:3003
      FRONTEND_URLS: http://localhost:3003
      ML_SERVICE_URL: http://ml-service:8000/api
      SEED_DEMO_DOCTORS: "true"
    ports:
      - "5000:5000"
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3003
      BACKEND_URL: http://backend:5000
      NEXT_PUBLIC_APP_URL: http://localhost:3003
    ports:
      - "3003:3003"

volumes:
  mongo-data:
  backend-uploads:
